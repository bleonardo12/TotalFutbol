services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: totalfutbol
      POSTGRES_PASSWORD: totalfutbol
      POSTGRES_DB: totalfutbol
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: totalfutbol
      MINIO_ROOT_PASSWORD: totalfutbol123
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # consola web
    volumes:
      - minio-data:/data

volumes:
  db-data:
  redis-data:
  minio-data:
